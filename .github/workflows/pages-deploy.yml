# pages-deploy — ship to Cloudflare Pages, org-owned (workflow_call).
#
# The caller keeps its own trigger (push to main, workflow_dispatch,
# workflow_call from an automerge chain) and its own `concurrency:` block —
# one production deploy at a time is the caller's promise about ITS
# environment. This flow owns the runner pin, node setup, env plumbing, and
# the install/build; the deploy command itself is an input because repos pin
# wrangler versions and output dirs differently, and this file has no
# business unifying that by breakage.
#
# SELF-HOSTED, ALWAYS. Org Actions budgets are $0 with `prevent_further_usage`
# on: a hosted deploy job does not get slow, it silently never runs — pushes
# to main stop publishing (HQ#528). No runner input on purpose.
#
# This repo is PUBLIC (it serves the org profile), so nothing secret lives
# here: the API token arrives via `secrets: inherit` from the private caller;
# the account id arrives as an input or a secret, whichever idiom the caller
# already uses.
name: pages-deploy

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      build-env:
        # Client-public KEY=VALUE lines (one per line); see web-ci. Public
        # values only; secrets do not ride this input.
        type: string
        default: ''
      build:
        # false = static site, deploy the tree as-is (no node, no install).
        type: boolean
        default: true
      cloudflare-account-id:
        # An identifier, not a secret — it appears in dashboard URLs and
        # wrangler.toml. Callers that keep it in a secret instead pass the
        # CLOUDFLARE_ACCOUNT_ID secret and omit this.
        type: string
        default: ''
      deploy-command:
        # The exact deploy line, e.g.
        #   npx --yes wrangler@4 pages deploy .svelte-kit/cloudflare --project-name travel --branch main
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Export client-public build env
        if: inputs.build-env != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: printf '%s\n' "$BUILD_ENV" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # No `cache: npm` — see web-ci for the measured reason.
      - name: install
        if: inputs.build
        run: npm ci

      - name: build
        if: inputs.build
        run: npm run build

      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id != '' && inputs.cloudflare-account-id || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ${{ inputs.deploy-command }}
